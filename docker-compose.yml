# 本地编排（开发用，非 Zeabur 部署方式）。
# 三个服务各自一个目录、自带 Dockerfile，与 quant-strategy-lab 结构一致：
#   backend  —— FastAPI 推理服务（容器 :8000，本机 :18000）
#   frontend —— Astro 静态站（容器 :80，本机 :18081，仅供直连调试）
#   gateway  —— 网关，反代 /api -> backend、/ -> frontend（容器 :80，本机 :18080）
#
# 启动：docker compose up --build
# 访问：http://localhost:18080
#
# 注意：backend 在构建期下载 u2net 模型（需网络，约百 MB）；无网络时后端镜像构建会失败。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8000
    ports:
      - "18000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "18081:80"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:80
    ports:
      - "18080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
