# 本地编排（开发用，非 Zeabur 部署方式）。
# 三个服务各自一个目录、自带 Dockerfile，与 quant-strategy-lab 结构一致：
#   backend  —— FastAPI 推理服务（容器 :8000，本机 :18000）
#   frontend —— Astro 静态站（容器 :80，本机 :18081，仅供直连调试）
#   gateway  —— 网关，反代 /api -> backend、/ -> frontend（容器 :80，本机 :18080）
#
# 启动：docker compose up --build
# 访问：http://localhost:18080
#
# 注意：isnet-general-use（抠图，约180MB）与 Kronos 权重（经 hf-mirror.com，观测站预测用）
# 都是运行期首次调用时惰性下载到 /data（见 backend/Dockerfile），构建期不需要联网；
# 首次真正用到对应功能时才会联网下载，之后常驻 /data 复用。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8000
    ports:
      - "18000:8000"
    volumes:
      # 观测站账本持久化（对应 Zeabur 上挂到 /data 的 Volume）
      - observatory-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "18081:80"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:80
    ports:
      - "18080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  observatory-data:
