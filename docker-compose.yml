# 本地编排（开发用，非 Zeabur 部署方式）。
# 三个服务各自一个目录、自带 Dockerfile，与 quant-strategy-lab 结构一致：
#   backend  —— FastAPI 推理服务（:8000）
#   frontend —— Astro 静态站（nginx :80，纯静态）
#   gateway  —— 网关，反代 /api -> backend、/ -> frontend（:8080 对外）
#
# 启动：docker compose up --build
# 访问：http://localhost:8080
#
# 注意：backend 在构建期下载 u2net 模型（需网络，约百 MB）；无网络时后端镜像构建会失败。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
