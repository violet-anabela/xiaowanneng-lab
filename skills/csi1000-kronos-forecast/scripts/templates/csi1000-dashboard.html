<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中证1000 · Kronos 概率预测</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#0e1b2f;--panel2:#12233b;--text:#edf5ff;--muted:#8da2bd;--grid:#263954;--blue:#55a7ff;--cyan:#67e8f9;--red:#fb7185;--green:#34d399;--amber:#fbbf24;--line:#dce9f8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#15325b 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.shell{max-width:1240px;margin:auto;padding:30px 24px 48px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:8px 0 24px}.top h1{margin:0;font-size:clamp(25px,4vw,42px);letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;text-align:right;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{padding:18px;border:1px solid #213754;background:linear-gradient(145deg,rgba(18,35,59,.95),rgba(12,25,44,.92));border-radius:16px}.metric .label{font-size:12px;color:var(--muted);margin-bottom:10px}.metric .value{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}.metric .detail{font-size:12px;color:var(--muted);margin-top:6px}.down{color:var(--red)}.up{color:var(--green)}.chart-panel{position:relative;border:1px solid #213754;background:rgba(10,23,41,.88);border-radius:18px;padding:20px 20px 14px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.chart-head h2{margin:0;font-size:17px}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}.legend i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}.chart-wrap{position:relative;width:100%;height:480px}svg{display:block;width:100%;height:100%;overflow:visible}.tooltip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:210px;padding:12px 14px;border:1px solid #335276;border-radius:12px;background:rgba(5,14,27,.96);box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:12px;line-height:1.75}.tooltip strong{display:block;font-size:13px;margin-bottom:3px}.tooltip .row{display:flex;justify-content:space-between;gap:18px;color:var(--muted)}.tooltip b{color:var(--text);font-weight:650}.table-panel{margin-top:18px;border:1px solid #213754;background:rgba(10,23,41,.88);border-radius:18px;padding:20px;overflow:hidden}.table-panel h2{margin:0 0 14px;font-size:17px}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{color:var(--muted);font-weight:600;text-align:right;padding:10px;border-bottom:1px solid #29415f;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:11px 10px;border-bottom:1px solid rgba(41,65,95,.55);font-variant-numeric:tabular-nums;white-space:nowrap}tr:last-child td{border-bottom:0}.signal{font-weight:700}.foot{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:820px){.shell{padding:22px 14px 36px}.top{align-items:flex-start;flex-direction:column}.sub{text-align:left}.metrics{grid-template-columns:repeat(2,1fr)}.chart-wrap{height:390px}.chart-head{align-items:flex-start;flex-direction:column}}@media(max-width:460px){.metrics{grid-template-columns:1fr}.chart-wrap{height:340px}.metric{padding:14px}.chart-panel,.table-panel{padding:14px}}
:root{color-scheme:light;--bg:#f5f7fb;--panel:#ffffff;--panel2:#ffffff;--text:#172033;--muted:#66758a;--grid:#e3e9f1;--blue:#3478d4;--cyan:#1677b8;--red:#d6455d;--green:#14845f;--amber:#cf8a12;--line:#253858}
body{background:radial-gradient(circle at 84% 0,#e7f1ff 0,transparent 34%),var(--bg)}
.metric{border-color:#dde5ef;background:#fff;box-shadow:0 8px 24px rgba(38,58,87,.06)}
.chart-panel,.table-panel{border-color:#dce5ef;background:#fff;box-shadow:0 12px 34px rgba(38,58,87,.07)}
.tooltip{border-color:#cbd8e7;background:rgba(255,255,255,.98);box-shadow:0 14px 36px rgba(38,58,87,.18)}
th{border-bottom-color:#dbe4ef}td{border-bottom-color:rgba(219,228,239,.82)}
</style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">Kronos · 30 Monte Carlo Paths</div>
  <header class="top"><h1>中证1000 概率预测</h1><div class="sub" id="update"></div></header>
  <section class="metrics" aria-label="核心指标">
    <article class="metric"><div class="label">下一交易日</div><div class="value" id="target"></div><div class="detail" id="origin"></div></article>
    <article class="metric"><div class="label">预测中心点位</div><div class="value" id="median"></div><div class="detail" id="change"></div></article>
    <article class="metric"><div class="label">方向模拟</div><div class="value" id="direction"></div><div class="detail" id="votes"></div></article>
    <article class="metric"><div class="label">高一致度历史表现</div><div class="value" id="accuracy"></div><div class="detail" id="samples"></div></article>
  </section>
  <section class="chart-panel">
    <div class="chart-head"><h2>历史走势与未来路径区间</h2><div class="legend"><span><i style="background:var(--blue)"></i>真实收盘</span><span><i style="background:var(--line)"></i>预测中位数</span><span><i style="height:9px;background:rgba(85,167,255,.28)"></i>10%–90%路径区间</span></div></div>
    <div class="chart-wrap"><svg id="chart" role="img" aria-label="中证1000历史与预测曲线"></svg><div class="tooltip" id="tooltip" role="tooltip"></div></div>
  </section>
  <section class="table-panel"><h2>未来12个交易日</h2><div class="table-scroll"><table><thead><tr><th>日期</th><th>中位点位</th><th>预测涨跌幅</th><th>强弱</th><th>80%路径区间</th><th>上涨</th><th>下跌</th><th>方向一致度</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot">“强烈”表示预测中位点位相对基准收盘的涨跌幅绝对值超过2%；方向一致度是30条模型路径中多数方向的占比，不是已校准的真实概率。模型输出不构成投资建议。</div></section>
</main>
<script>
const D=__DATA_JSON__;const $=s=>document.querySelector(s);const fmt=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const pct=n=>(n*100).toFixed(1)+'%';const signedPct=n=>(n>=0?'+':'')+(n*100).toFixed(2)+'%';const strength=n=>n>.02?'强烈上涨':n<-.02?'强烈下跌':n>0?'温和上涨':n<0?'温和下跌':'基本持平';
const calibNote=D.calibrationActive?`已用${D.calibrationSamples}个结算样本做统计校正（历史偏差${D.calibrationBias>=0?'+':''}${(D.calibrationBias*100).toFixed(2)}%）`:`结算样本${D.calibrationSamples}个，未达30个校正门槛，展示未校正原始预测`;
$('#update').innerHTML=`最新完整行情 ${D.originDate}<br>页面更新 ${new Date(D.updatedAt).toLocaleString('zh-CN',{hour12:false})}<br>反思环节：${calibNote}`;$('#target').textContent=D.targetDate;$('#origin').textContent=`基准收盘 ${fmt(D.originClose)}`;$('#median').textContent=fmt(D.nextMedian);const ret=D.nextMedian/D.originClose-1;$('#change').innerHTML=`较基准 <span class="${ret>=0?'up':'down'}">${signedPct(ret)} · ${strength(ret)}</span> · 区间 ${fmt(D.nextP10)}–${fmt(D.nextP90)}`;const down=1-D.nextUp,dir=D.nextUp>down?'偏上涨':D.nextUp<down?'偏下跌':'方向均衡',conf=Math.max(D.nextUp,down);$('#direction').innerHTML=`<span class="${D.nextUp>down?'up':'down'}">${dir}</span>`;$('#votes').textContent=`上涨 ${pct(D.nextUp)} · 下跌 ${pct(down)} · 一致度 ${pct(conf)}`;$('#accuracy').textContent=D.highAccuracy==null?'待积累':pct(D.highAccuracy);$('#samples').textContent=`已结算高一致度判断 ${D.highCount} 次`;
$('#rows').innerHTML=D.forecast.map(x=>{const dn=1-x.p_up,c=Math.max(x.p_up,dn),r=x.calibrated_median_close/D.originClose-1;return `<tr><td>${x.target_date}</td><td>${fmt(x.calibrated_median_close)}</td><td class="${r>=0?'up':'down'}">${signedPct(r)}</td><td class="signal ${r>=0?'up':'down'}">${strength(r)}</td><td>${fmt(x.calibrated_p10_close)}–${fmt(x.calibrated_p90_close)}</td><td>${pct(x.p_up)}</td><td>${pct(dn)}</td><td class="signal ${x.p_up>=.5?'up':'down'}">${pct(c)}</td></tr>`}).join('');
const svg=$('#chart'),tip=$('#tooltip'),NS='http://www.w3.org/2000/svg';function el(n,a={}){const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x}function draw(){svg.replaceChildren();const box=svg.getBoundingClientRect(),W=Math.max(320,box.width),H=Math.max(300,box.height),m={t:18,r:20,b:42,l:66},iw=W-m.l-m.r,ih=H-m.t-m.b;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const hist=D.history.map(x=>({date:new Date(x.timestamps),actual:+x.close})),fc=D.forecast.map(x=>({date:new Date(x.target_date+'T00:00:00'),median:+x.calibrated_median_close,p10:+x.calibrated_p10_close,p90:+x.calibrated_p90_close,pUp:+x.p_up,actual:x.actual_close==null?null:+x.actual_close})),origin={date:new Date(D.originDate+'T00:00:00'),median:D.originClose,p10:D.originClose,p90:D.originClose,pUp:null,actual:D.originClose};const all=[...hist,...fc],t0=Math.min(...all.map(x=>+x.date)),t1=Math.max(...all.map(x=>+x.date)),ys=[...hist.map(x=>x.actual),...fc.flatMap(x=>[x.p10,x.p90])],pad=(Math.max(...ys)-Math.min(...ys))*.08,x=d=>m.l+(+d-t0)/(t1-t0)*iw,y=v=>m.t+(Math.max(...ys)+pad-v)/(Math.max(...ys)-Math.min(...ys)+2*pad)*ih;
svg.append(el('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent',stroke:'var(--grid)'}));for(let i=0;i<=4;i++){const yy=m.t+ih*i/4,val=(Math.max(...ys)+pad)-(Math.max(...ys)-Math.min(...ys)+2*pad)*i/4;svg.append(el('line',{x1:m.l,x2:W-m.r,y1:yy,y2:yy,stroke:'var(--grid)','stroke-width':1}));const tx=el('text',{x:m.l-10,y:yy+4,'text-anchor':'end',fill:'var(--muted)','font-size':11});tx.textContent=Math.round(val).toLocaleString('zh-CN');svg.append(tx)}const ticks=W<600?3:5;for(let i=0;i<ticks;i++){const tt=new Date(t0+(t1-t0)*i/(ticks-1)),xx=x(tt);const tx=el('text',{x:xx,y:H-14,'text-anchor':i===0?'start':i===ticks-1?'end':'middle',fill:'var(--muted)','font-size':11});tx.textContent=tt.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});svg.append(tx)}const path=(arr,key)=>arr.map((d,i)=>(i?'L':'M')+x(d.date)+','+y(d[key])).join(' '),fca=[origin,...fc];const band=[...fca.map((d,i)=>(i?'L':'M')+x(d.date)+','+y(d.p90)),...fca.slice().reverse().map(d=>'L'+x(d.date)+','+y(d.p10))].join(' ')+'Z';svg.append(el('path',{d:band,fill:'rgba(85,167,255,.20)',stroke:'none'}));svg.append(el('path',{d:path(hist,'actual'),fill:'none',stroke:'var(--blue)','stroke-width':2.4,'stroke-linejoin':'round'}));svg.append(el('path',{d:path(fca,'median'),fill:'none',stroke:'var(--line)','stroke-width':2.6,'stroke-linejoin':'round'}));const bx=x(origin.date);svg.append(el('line',{x1:bx,x2:bx,y1:m.t,y2:H-m.b,stroke:'var(--amber)','stroke-width':1.2,'stroke-dasharray':'5 5'}));const guide=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--cyan)','stroke-width':1,'stroke-dasharray':'3 3',visibility:'hidden'});svg.append(guide);const dot=el('circle',{r:4,fill:'var(--cyan)',stroke:'var(--bg)','stroke-width':2,visibility:'hidden'});svg.append(dot);const hover=el('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent'});hover.style.cursor='crosshair';hover.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,date=new Date(t0+(Math.max(m.l,Math.min(W-m.r,px))-m.l)/iw*(t1-t0));let candidates=[...hist.map(d=>({...d,type:'历史'})),...fc.map(d=>({...d,type:'预测'}))];const d=candidates.reduce((a,b)=>Math.abs(+b.date-date)<Math.abs(+a.date-date)?b:a);const xx=x(d.date),value=d.type==='历史'?d.actual:d.median;guide.setAttribute('x1',xx);guide.setAttribute('x2',xx);guide.setAttribute('visibility','visible');dot.setAttribute('cx',xx);dot.setAttribute('cy',y(value));dot.setAttribute('visibility','visible');const forecastReturn=d.type==='预测'?d.median/D.originClose-1:null;const rows=d.type==='历史'?`<div class="row"><span>真实收盘</span><b>${fmt(d.actual)}</b></div>`:`<div class="row"><span>预测中位数</span><b>${fmt(d.median)}</b></div><div class="row"><span>预测涨跌幅</span><b>${signedPct(forecastReturn)} · ${strength(forecastReturn)}</b></div><div class="row"><span>80%路径区间</span><b>${fmt(d.p10)}–${fmt(d.p90)}</b></div><div class="row"><span>上涨 / 下跌</span><b>${pct(d.pUp)} / ${pct(1-d.pUp)}</b></div>${d.actual==null?'':`<div class="row"><span>真实收盘</span><b>${fmt(d.actual)}</b></div>`}`;tip.innerHTML=`<strong>${d.date.toLocaleDateString('zh-CN')} · ${d.type}</strong>${rows}`;tip.style.display='block';const left=Math.min(box.width-tip.offsetWidth-8,Math.max(8,e.clientX-r.left+14)),top=Math.max(8,e.clientY-r.top-tip.offsetHeight-12);tip.style.left=left+'px';tip.style.top=top+'px'});hover.addEventListener('pointerleave',()=>{tip.style.display='none';guide.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden')});svg.append(hover)}draw();new ResizeObserver(draw).observe(svg.parentElement);
</script>
</body>
</html>
