# 本地 docker-compose 用的网关配置（直接写 compose 服务名，无需 envsubst）。
# 通过 compose 把本文件挂到 /etc/nginx/conf.d/default.conf。
# 用变量 + resolver 形式，避免 nginx 启动期解析不到 backend/frontend 服务名而启动失败。
server {
    listen 80;
    server_name _;

    server_tokens off;

    # Docker 内置 DNS；变量 proxy_pass 在运行期解析上游（服务名随 compose 就绪后可达）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $backend_upstream  "http://backend:8000";
    set $frontend_upstream "http://frontend:80";

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location = /livez {
        rewrite ^ /livez break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
    }
    location = /readyz {
        rewrite ^ /readyz break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
