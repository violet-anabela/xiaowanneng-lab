# Dokploy 部署用编排（本地开发请用 docker-compose.yml）。
# 与开发编排的区别：
#   - 不映射宿主机端口，由 Dokploy 的 Traefik 通过域名转发到 gateway:80。
#   - gateway 加入外部网络 dokploy-network，Traefik 才能访问到它。
#   - backend 的 /data 绑定到宿主机 /opt/xwn-data，模型权重与观测站账本跨部署持久化；
#     首次部署前需把 isnet-general-use.onnx 放进 /opt/xwn-data/models/，避免运行期从 GitHub 慢速下载。
# 注意：前端构建期的 check_dev_docs 只读取 docker-compose.yml，改本文件不影响文档一致性检查。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8000
    volumes:
      - /opt/xwn-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:80
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
