# 前端静态托管（纯静态，不含反代；/api 反代由 nginx/ 网关负责）。
# 注：map 必须在 http 上下文（即 server 块之外），不能写进 server {}。
map $request_uri $skill_cache {
    default                           "no-cache";
    # 版本化 Skill zip（文件名带 -vX.Y.Z）：内容稳定，长期缓存
    # 稳定别名 zip（如 <slug>.zip）：不缓存，每次重新验证（避免拿到旧包）
    ~^/skills/.*-v[0-9]               "public, max-age=31536000, immutable";
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml+rss;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Skill zip 下载：版本化长缓存 / 别名不缓存
    location /skills/ {
        add_header Cache-Control $skill_cache always;
        try_files $uri =404;
    }

    # 其余请求：托管 Astro 静态产物
    location / {
        try_files $uri $uri/ /index.html;
    }
}
